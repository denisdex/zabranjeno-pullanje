<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="32" height="32" viewBox="0 0 32 32">
 <defs>
  <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9aa2a9"/><stop offset=".35" stop-color="#6a727a"/><stop offset=".72" stop-color="#3c4248"/><stop offset="1" stop-color="#16191c"/>
  </linearGradient>
  <linearGradient id="t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3136"/><stop offset="1" stop-color="#16191c"/></linearGradient>
  <filter id="sj" x="-25%" y="-25%" width="150%" height="150%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="1.1" result="d"/><feGaussianBlur in="d" stdDeviation="1.2" result="b"/>
    <feFlood flood-color="#3aa8ff"/><feComposite in2="b" operator="in"/>
  </filter>
  <g id="ruka" transform="translate(5 5) rotate(-34) scale(.84)" stroke="#0b0d0f" stroke-width="1.1" stroke-linejoin="round">
    <!-- manžeta -->
    <path d="M-3.4 21 H12.6 L14.2 28.4 H-5 Z" fill="url(#m)"/>
    <path d="M-3.9 23.6 H13.2 L13.7 25.9 H-4.4 Z" fill="url(#t)" stroke-width=".7"/>
    <circle cx="-1" cy="27.1" r=".8" fill="#eef2f4" stroke-width=".5"/><circle cx="4.6" cy="27.1" r=".8" fill="#eef2f4" stroke-width=".5"/><circle cx="10.2" cy="27.1" r=".8" fill="#eef2f4" stroke-width=".5"/>
    <!-- nadlanica -->
    <path d="M-3 12.4 C-3 11 11.8 11 11.8 12.6 L12.4 21.6 H-3.6 Z" fill="url(#m)"/>
    <path d="M-2.4 16.6 H11.9" fill="none" stroke-width=".7" stroke-opacity=".8"/>
    <circle cx="-.6" cy="14.4" r=".75" fill="#eef2f4" stroke-width=".5"/><circle cx="4.6" cy="14.2" r=".75" fill="#eef2f4" stroke-width=".5"/><circle cx="9.6" cy="14.4" r=".75" fill="#eef2f4" stroke-width=".5"/>
    <!-- palac s kandžom -->
    <path d="M-2.6 14.6 L-6.6 11.2 L-8.6 9.6 L-7.6 12.6 L-5.8 15.6 C-5.2 18 -3.6 19.6 -2.2 19.4 Z" fill="url(#m)"/>
    <!-- prsti: pločice i kandže -->
    <path d="M7 6.6 L8.9 3.2 L10.8 6.6 V13 H7 Z" fill="url(#m)"/>
    <path d="M2.6 4.6 L4.6 1.2 L6.6 4.6 V12.6 H2.6 Z" fill="url(#m)"/>
    <path d="M-2.3 4.2 L0 0 L2.3 4.2 V12.6 H-2.3 Z" fill="url(#m)"/>
    <path d="M-2.3 7.2 H2.3 M-2.3 10 H2.3 M2.6 7.4 H6.6 M2.6 10.2 H6.6 M7 8.8 H10.8 M7 11.2 H10.8" fill="none" stroke-width=".65"/>
    <!-- odsjaj -->
    <path d="M-1.2 4.4 L-.2 2 M-1.3 5.6 V11.8 M3.6 5 V11.6" fill="none" stroke="#ffffff" stroke-width=".7" stroke-opacity=".9" stroke-linecap="round"/>
    <path d="M-2.2 13.2 C1 12.4 7 12.4 10.6 13" fill="none" stroke="#ffffff" stroke-width=".6" stroke-opacity=".6" stroke-linecap="round"/>

